[project]
authors = [{name = "Leon David Zipp", email = "leondavidzipp@gmx.de"}]
dependencies = []
name = "datasource-cleaner"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
datasource_cleaner = { path = ".", editable = true }

[tool.pixi.tasks]
fmt = "pixi exec ruff format && pixi exec ruff check --fix"
lint = "pixi exec ruff format --check && pixi exec ruff check"

[tool.pixi.dependencies]
polars = ">=2.0.0,<3"
numpy = ">=2.5.4,<3"
sqlalchemy = ">=2.1.4,<3"
